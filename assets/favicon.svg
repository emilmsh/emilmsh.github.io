<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- EH monogram in ink on the pale blue of the portrait backdrop. The serif
       stack falls back to a system serif: an SVG favicon cannot pull in the
       base64 Libertinus face from assets/fonts.css. -->
  <rect width="64" height="64" rx="12" fill="#dbe5f5"/>
  <text x="32" y="42.5" fill="#24292e"
        font-family="Libertinus Serif, Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="600" letter-spacing="-0.5"
        text-anchor="middle">EH</text>
</svg>
